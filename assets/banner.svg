<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes particleShimmer {
        0% { opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { opacity: 0.2; }
      }
      @keyframes gradientShift {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #ec4899; }
        100% { stop-color: #38bdf8; }
      }

      .pulse-bg {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 600px 210px;
      }
      .circuit-line {
        stroke-dasharray: 8 12;
        animation: dashMove 14s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 6 10;
        animation: dashMove 8s linear infinite reverse;
      }
      .floating-node-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatAlt 6s ease-in-out infinite;
      }
      .particle {
        animation: particleShimmer 3s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Outer Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" rx="15" />

  <!-- Background Grid Lines for Technical Aesthetic -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />

    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Ambient Pulsing Glow Blobs (Kept behind foreground content) -->
  <g class="pulse-bg">
    <circle cx="280" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)" />
    <circle cx="920" cy="220" r="190" fill="#818cf8" opacity="0.14" filter="url(#glowPurple)" />
    <circle cx="600" cy="330" r="140" fill="#ec4899" opacity="0.08" filter="url(#glowPurple)" />
  </g>

  <!-- Dynamic Animated Circuit Execution Pipelines -->
  <g stroke-linecap="round">
    <!-- Pipeline 1: Source to JIT -->
    <path d="M 60 90 L 220 90 Q 260 90 280 120 L 320 180" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" class="circuit-line" />
    <!-- Pipeline 2: JIT to Machine Code -->
    <path d="M 880 180 L 920 120 Q 940 90 980 90 L 1140 90" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.4" class="circuit-line-fast" />
    <!-- Pipeline 3: Lower Data Bus -->
    <path d="M 120 360 L 350 360 Q 380 360 400 330 L 420 300" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3" class="circuit-line" />
    <path d="M 780 300 L 800 330 Q 820 360 850 360 L 1080 360" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" class="circuit-line-fast" />
  </g>

  <!-- Shimmering Particles along pipeline -->
  <circle cx="160" cy="90" r="3.5" fill="#38bdf8" class="particle" style="animation-delay: 0.2s;" />
  <circle cx="270" cy="105" r="4" fill="#818cf8" class="particle" style="animation-delay: 0.7s;" />
  <circle cx="930" cy="105" r="4" fill="#c084fc" class="particle" style="animation-delay: 1.2s;" />
  <circle cx="1040" cy="90" r="3.5" fill="#38bdf8" class="particle" style="animation-delay: 1.8s;" />
  <circle cx="230" cy="360" r="3" fill="#10b981" class="particle" style="animation-delay: 0.5s;" />
  <circle cx="970" cy="360" r="3" fill="#f59e0b" class="particle" style="animation-delay: 1.5s;" />

  <!-- Decorative Architectural Nodes (Floating Left & Right) -->
  <!-- Left Side: Source & AST Execution Node -->
  <g class="floating-node-1" transform="translate(60, 160)">
    <rect width="160" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="24" cy="26" r="6" fill="#38bdf8" />
    <text x="38" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">BYTECODE &amp; JIT</text>
    <text x="24" y="52" fill="#94a3b8" font-family="monospace" font-size="10">CPython • PyPy • V8</text>
  </g>

  <!-- Right Side: WASM & Native AOT Node -->
  <g class="floating-node-2" transform="translate(980, 160)">
    <rect width="160" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="24" cy="26" r="6" fill="#10b981" />
    <text x="38" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">AOT &amp; NATIVE</text>
    <text x="24" y="52" fill="#94a3b8" font-family="monospace" font-size="10">GraalVM • Bun • Wasm</text>
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND CONTENT: Header, Titles, Pills                -->
  <!-- Placed strictly at the end to ensure topmost z-order     -->
  <!-- ======================================================== -->

  <!-- Top Pill / Super-Header -->
  <g transform="translate(470, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4" fill="#38bdf8" />
    <text x="32" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED RUNTIMES ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
    Awesome Programming Language Runtimes
  </text>

  <!-- Gradient Sub-Bar under Title -->
  <rect x="420" y="162" width="360" height="3.5" rx="1.75" fill="url(#primaryGrad)" />

  <!-- Subtitle -->
  <text x="600" y="205" text-anchor="middle" class="sub-text" font-size="17" fill="#cbd5e1">
    Virtual Machines • JIT Compilers • Native AOT • WebAssembly &amp; Cloud Managed Runtimes
  </text>

  <text x="600" y="235" text-anchor="middle" class="sub-text" font-size="13.5" fill="#94a3b8">
    Benchmarking execution models, GIL removal, startup latency, and production throughput across modern languages
  </text>

  <!-- Architecture Capability Badges / Interactive Tags (Centered Below) -->
  <g transform="translate(190, 275)">
    <!-- Tag 1: JIT Compilers -->
    <g transform="translate(0, 0)">
      <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="72.5" y="22" text-anchor="middle" fill="#38bdf8" class="badge-text">⚡ JIT COMPILATION</text>
    </g>

    <!-- Tag 2: Native AOT -->
    <g transform="translate(160, 0)">
      <rect width="140" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="70" y="22" text-anchor="middle" fill="#818cf8" class="badge-text">🚀 NATIVE AOT</text>
    </g>

    <!-- Tag 3: GIL-Free Concurrency -->
    <g transform="translate(315, 0)">
      <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="85" y="22" text-anchor="middle" fill="#f43f5e" class="badge-text">🔥 FREE-THREADED / NO-GIL</text>
    </g>

    <!-- Tag 4: WebAssembly -->
    <g transform="translate(500, 0)">
      <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="72.5" y="22" text-anchor="middle" fill="#10b981" class="badge-text">🌐 WEBASSEMBLY</text>
    </g>

    <!-- Tag 5: Polyglot VMs -->
    <g transform="translate(660, 0)">
      <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="80" y="22" text-anchor="middle" fill="#f59e0b" class="badge-text">🔮 POLYGLOT ENGINES</text>
    </g>
  </g>

  <!-- Footer Metadata line inside banner -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" letter-spacing="0.5">
    Python (CPython, PyPy, GraalPy) • JavaScript (Node.js, Bun, Deno, V8) • Go • Rust • .NET Core • Julia • Wasm
  </text>
</svg>